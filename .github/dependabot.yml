version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint requires typescript < 6.1
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Keep @types/node aligned with the Node major used by the project
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # wdio 10 needs all @wdio/* packages together and a rewrite of the e2e helpers
      # (Browser.executeAsync removed, Element vs ChainablePromiseElement types)
      - dependency-name: "@wdio/*"
        update-types: [version-update:semver-major]
      - dependency-name: webdriverio
        update-types: [version-update:semver-major]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    # The composite actions pin their own action versions
    directories:
      - /
      - /.github/actions/setup-node-deps
      - /.github/actions/linux-tauri-deps
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
