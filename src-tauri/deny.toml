# cargo-deny configuration (run from src-tauri: `cargo deny check`).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Only the platforms the app ships on
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
# Vulnerabilities, unsound and yanked crates fail the check. Unmaintained crates only fail for direct
# dependencies: Tauri's GTK3 stack (Linux) pulls several unmaintained transitive crates we cannot upgrade.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Add accepted advisories here with a reason, e.g.:
    # { id = "RUSTSEC-0000-0000", reason = "transitive dependency of tauri, no patched version available" },
    # Same justification as src-tauri/.cargo/audit.toml
    { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin attack, no fix available) is only reached through sqlx-mysql, which is in Cargo.lock because of sqlx-macros-core but is never compiled: the app uses SQLite only. Revisit when sqlx drops the lockfile entry." },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.30.1 (bundled SQLite < 3.54, uninitialized memory returned when a database is opened with a -wal sibling of a different page size) is pulled in by sqlx 0.8 via tauri-plugin-sql 2.6, which still requires sqlx 0.8; the fix needs libsqlite3-sys >= 0.39 (sqlx 0.9 uses ^0.37, so it would not help either). Local attack only, and the app opens only its own database: a restored backup is validated and the -wal/-shm files are removed before it replaces the database (src/db/backup.ts). Revisit when tauri-plugin-sql moves to a sqlx that depends on libsqlite3-sys >= 0.39. Added 2026-11-10." },
]

[licenses]
version = 2
# Permissive licenses only. A new dependency with a different license fails CI and must be reviewed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
]
confidence-threshold = 0.8

# The app crate itself (publish = false in Cargo.toml) is not checked
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
